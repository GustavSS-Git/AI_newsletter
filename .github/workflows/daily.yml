name: Daily edition

on:
  schedule:
    # Target: 05:00 Swedish time all year. GitHub cron is UTC only, so both candidates fire and the
    # gate job keeps the one that matches today's offset: 03:00 UTC in summer (CEST), 04:00 UTC in
    # winter (CET). GitHub may start scheduled runs some minutes late; the gate doesn't care.
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: ingest + triage only, print ranked clusters, commit nothing"
        type: boolean
        default: false
      email_only:
        description: "Email only: skip the build and (re)send the latest saved edition"
        type: boolean
        default: false

permissions:
  contents: write              # commit the new edition back to main

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=Europe/Stockholm date +%z)" = "+0200" ]; then want="0 3 * * *"; else want="0 4 * * *"; fi
          if [ "$SCHEDULE" = "$want" ]; then run=true; else run=false; fi
          echo "schedule='$SCHEDULE' want='$want' run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  edition:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Build edition
        if: ${{ !inputs.email_only }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Exits non-zero on validation failure: the job fails, nothing is committed, GitHub emails you.
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and push edition
        if: ${{ !inputs.dry_run && !inputs.email_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions site
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Edition $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Email edition (Buttondown)
        if: ${{ !inputs.dry_run }}
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        # Mode comes from config.yaml (email.mode). Skips quietly if the secret isn't set yet.
        # Safe to re-run: one email per edition date (checked via the API + idempotency key).
        run: python scripts/send_email.py
